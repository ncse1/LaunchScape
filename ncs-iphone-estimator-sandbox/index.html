<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>NCS Electric — Field Estimator</title><style>
:root{--navy:#0b1f3a;--blue:#0b7bc1;--ink:#182230;--line:#dee6ef;--muted:#64748b;--green:#047857}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:var(--ink);background:#f2f5f8;margin:0;padding:0 0 70px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:var(--navy);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}header b{font-size:21px}header small{display:block;color:#c6d9e8;margin-top:3px}header button{background:#ffffff28;color:white;border:1px solid #ffffff55;padding:10px 12px;border-radius:9px}.alert{padding:12px;background:#fff2c3;border-bottom:2px solid #ecb444;font-size:13px;line-height:1.4;color:#674100}.alert b{display:block}main{max-width:820px;margin:auto;padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 4px 13px #142d4b0d;margin-bottom:14px}h1{font-size:25px;line-height:1.15;margin:2px 0 12px}h2{font-size:20px;margin:3px 0 10px}.muted{color:var(--muted);line-height:1.45;font-size:14px}.steps{display:flex;gap:5px;justify-content:space-between;margin-bottom:16px}.steps span{flex:1;padding:8px 3px;border-radius:9px;text-align:center;background:#e4ebf2;color:#53677c;font-size:12px;font-weight:700}.steps span.active{background:var(--blue);color:#fff}label{display:block;margin-bottom:11px;font-weight:700;font-size:13px}input,select,textarea{margin-top:5px;width:100%;border:1px solid #c6d2df;padding:13px 11px;background:white;border-radius:10px;color:var(--ink);font-size:16px}textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.row button{flex:1}.btn{border:1px solid #cbd5e1;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:800;background:#f5f7fa;color:var(--ink);min-height:45px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:#b91c1c}.footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:15px}.footer>div{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;font-size:11px;color:#9a3412;background:#ffedd5;padding:4px 8px;border-radius:99px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.photo{background:#f3f6f9;border:1px solid var(--line);padding:5px;border-radius:9px}.photo img{width:100%;height:125px;object-fit:cover;border-radius:6px}.photo button{border:0;background:none;color:#b91c1c;font-size:12px;margin-top:6px}.option{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}.option input{width:23px;height:23px;margin:0;flex-shrink:0}.option b{display:block;font-size:15px}.option small{display:block;color:#697586;line-height:1.4;margin-top:3px}.line{border:1px solid var(--line);padding:12px;border-radius:11px;margin:10px 0}.line h3{font-size:15px;margin:2px 0 10px}.line .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{background:var(--navy);color:white;border-radius:14px;padding:16px;margin:15px 0}.summary .pair{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff2c}.summary .pair:last-child{border:0}.warn{border:1px solid #e9c06c;background:#fffae8;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}.good{background:#e8fff1;color:#05603a;border-color:#84c9a1}.proposal{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.proposal header{all:unset}.proposal h1{font-size:24px;color:var(--navy)}.proposal small{display:block}.proposal .section{margin:18px 0 0;border-top:1px solid #dae0e7;padding-top:13px}.proposal table{width:100%;border-collapse:collapse}.proposal td{padding:8px 0;border-bottom:1px solid #edf0f4;vertical-align:top}.proposal td:last-child{text-align:right;white-space:nowrap}.proposal .total{font-weight:900}.hidden{display:none!important}.status{border-radius:12px;border:1px solid #bfd4ea;padding:11px;background:#e9f4ff;margin:10px 0}.tiny{font-size:12px}.saved{display:grid;gap:8px}.saved button{text-align:left;border:1px solid #d5e2ed;background:white;padding:12px;border-radius:11px}.saved b{display:block}.saved small{display:block;color:#64748b;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.actions button{flex:1}.error{color:#b42318}.photo-help{border-left:4px solid #f59e0b;padding:10px 13px;background:#fff8e7;font-size:13px}.mono{font-variant-numeric:tabular-nums}@media(max-width:600px){.photos{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.footer button{flex:1}.steps span{font-size:11px}}@page{size:letter;margin:.55in}@media print{body{background:white;padding:0}header,.alert,.steps,.screen,footer,.no-print{display:none!important}main{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:0;margin:0}.proposal{border:0;padding:0}.proposal h1{font-size:25px}.proposal .section{break-inside:avoid}.photos img{height:120px}}
</style></head><body>
<header><div><b>NCS ELECTRIC</b><small>Field Estimator · Review before sending</small></div><button id="home" type="button">⌂ Saved</button></header>
<div class="alert"><b>NCS FIELD ESTIMATOR — DRAFT UNTIL REVIEWED</b>Confirm materials, quantities, hours and scope before sending. Drafts and photos are saved only in this browser. AI photo interpretation is not connected.</div>
<main><div class="steps no-print" id="steps"></div><div id="screen" class="screen"></div><div id="printTarget" class="hidden"></div></main>
<input type="file" accept="image/*" capture="environment" id="camera" hidden><input type="file" accept="image/*" multiple id="library" hidden>
<script>
/* Shared deterministic engine: no AI estimates or external requests. */
(function(root){
'use strict';
const valid=x=>x!==''&&x!==null&&x!==undefined&&Number.isFinite(Number(x))&&Number(x)>=0;
const cents=x=>Math.round((x+Number.EPSILON)*100)/100;
function linePrice(row,rates){return cents(Number(row.qty)*cents(Number(row.material)*(1+Number(rates.markup)/100)+Number(row.hours)*Number(rates.crewSell)))}
function calculate(rows,rates){
 const ratesOK=rates&&['crewSell','crewCost','markup','overhead'].every(k=>valid(rates[k]))&&Number(rates.overhead)<=100&&Number(rates.crewSell)>0;
 const complete=Boolean(ratesOK&&rows.length&&rows.every(r=>String(r.label||'').trim()&&valid(r.qty)&&Number(r.qty)>0&&valid(r.material)&&valid(r.hours)));
 if(!complete)return {complete:false,sum:0,cost:0,profit:0,margin:0,overhead:0,afterOverhead:0};
 const sum=cents(rows.reduce((v,r)=>v+linePrice(r,rates),0));
 const cost=cents(rows.reduce((v,r)=>v+Number(r.qty)*(Number(r.material)+Number(r.hours)*Number(rates.crewCost)),0));
 const profit=cents(sum-cost),overhead=cents(sum*Number(rates.overhead)/100);
 return {complete:true,sum,cost,profit,margin:sum?profit/sum*100:0,overhead,afterOverhead:cents(profit-overhead)};
}
root.NCSPricing={calculate,linePrice};
})(globalThis);
</script>
<script>
'use strict';
const KEY='ncs-field-estimator-v2';
// Scope suggestions only. Job material costs and labor hours must be entered.
const CAT={
 'Electrical Panels':{'200A Panel Replacement':{items:['New panel enclosure and bus','Reconnect existing circuits','Label circuit directory','Grounding / bonding review','Permit allowance','Surge protective device']},'150A Panel Replacement':{items:['New panel','Reconnect circuits','Grounding review','Permit allowance']},'200A Service Upgrade':{items:['Service disconnect','Panel package','Grounding package','Utility coordination','Permit allowance']}},
 'Marine & Docks':{'Boat Lift Electrical':{items:['Power circuit','Disconnect','PVC conduit','Dock bonding check']},'Shore Power':{items:['Feeder','Pedestal','Circuit protection','Bonding check']}},
 'Lighting':{'Outdoor Lighting Installation':{items:['Transformer','Low voltage wiring','Fixtures','Timer/controls']},'LED Retrofit':{items:['LED fixtures','Disconnect/reconnect']}}
};
const $=s=>document.querySelector(s), money=x=>'$'+Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=(arr,sel)=>arr.map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const fresh=()=>({id:'test'+Date.now(),name:'',contact:'',address:'',description:'',photos:[],cat:'Electrical Panels',work:'200A Panel Replacement',selected:[],rows:[],extra:'',rates:{crewSell:225,crewCost:70,markup:40,overhead:20},date:new Date().toISOString()});
let d=fresh(),stage=0,saveError='';
function readSaved(){try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(value)?value:[]}catch(e){return []}}
function persist(list){try{localStorage.setItem(KEY,JSON.stringify(list));saveError='';return true}catch(e){saveError='Browser storage full or blocked. Remove a photo and try again. Print / Save PDF still works.';return false}}
function save(){d.date=new Date().toISOString();const a=readSaved(),i=a.findIndex(x=>x.id===d.id);if(i<0)a.unshift(d);else a[i]=d;return persist(a)}
function banner(){return '<p class="photo-help">Photos stay on this device. Nothing is uploaded, and the AI analysis feature is not available in this public test.</p>'}
function show(){document.querySelector('#steps').innerHTML=['Photo & Contact','Choose Work','Pricing','Proposal'].map((s,i)=>`<span class="${i===stage?'active':''}">${i+1}. ${s}</span>`).join('');$('#printTarget').classList.add('hidden');const root=$('#screen');root.classList.remove('hidden');if(stage===0)root.innerHTML=photoStep();if(stage===1)root.innerHTML=workStep();if(stage===2)root.innerHTML=pricingStep();if(stage===3)root.innerHTML=proposalStep();bind();window.scrollTo(0,0)}
function nav(back=true,next=true,nextText='Continue'){return `<div class="footer no-print"><div>${back?'<button type="button" class="btn" id="back">Back</button>':''}<button type="button" class="btn" id="save">Save Draft</button></div><div>${next?`<button type="button" class="btn primary" id="next">${nextText}</button>`:''}</div></div>`}
function photoStep(){return `<div class="card"><h1>1. Job photo & information</h1><p class="muted">Add customer details and job photos. Photos help document conditions; confirm all measurements in the field.</p><div class="actions"><button class="btn primary" id="take">📷 Take Photo</button><button class="btn" id="pick">▣ Photo Library</button></div><div class="photos">${d.photos.map((p,i)=>`<div class="photo"><img src="${p.data}" alt="Job photo"><button type="button" data-delete="${i}">Remove photo</button></div>`).join('')}</div>${banner()}<div class="grid"><label>Customer name<input id="name" value="${esc(d.name)}" placeholder="Customer name"></label><label>Customer contact<input id="contact" value="${esc(d.contact)}" placeholder="Phone or email"></label></div><label>Job address<input id="address" value="${esc(d.address)}" placeholder="Street address"></label><label>What can you see?<textarea id="description" placeholder="Example: existing outdoor panel, unknown model, customer requests replacement">${esc(d.description)}</textarea></label>${nav(false)}</div>`}
function workStep(){const works=Object.keys(CAT[d.cat]||{});return `<div class="card"><h1>2. Choose the electrical work</h1><p class="muted">Choose the work and confirm the included scope.</p><label>Category<select id="cat">${options(Object.keys(CAT),d.cat)}</select></label><label>Work<select id="work">${options(works,d.work)}</select></label><h2>What is included?</h2><p class="muted">Check the items the customer wants. Scope checkboxes describe inclusions; they do not add separate charges. Confirm code requirements and site conditions.</p><div>${(CAT[d.cat]?.[d.work]?.items||[]).map((label,i)=>`<label class="option"><input type="checkbox" data-item="${i}" ${d.selected.includes(label)?'checked':''}><span><b>${esc(label)}</b><small>Field check and final electrician approval required</small></span></label>`).join('')}</div><label>Additional work notes<textarea id="extra" placeholder="Scope notes for the proposal">${esc(d.extra)}</textarea></label>${nav()}</div>`}
function recalc(){return window.NCSPricing.calculate(d.rows,d.rates)}
function ensureRows(){if(!d.rows.length)d.rows=[{id:'base',label:d.work,qty:1,material:'',hours:''}]}
function pricingStep(){ensureRows();const c=recalc();return `<div class="card"><h1>3. Price the work</h1><p class="muted">Enter material cost and two-person crew hours per unit. Selling price = materials with markup + crew hours at the selling rate. Scope checkboxes are included in the base work and are not charged twice.</p><div class="grid">${[['crewSell','Crew selling rate / hour $'],['crewCost','Crew direct cost / hour $'],['markup','Material markup %'],['overhead','Overhead allowance % of sales']].map(([key,label])=>`<label>${label}<input type="number" min="0" step=".01" data-rate="${key}" value="${esc(d.rates[key])}"></label>`).join('')}</div><p class="muted">Defaults: regular service $225/hr, two-person direct cost $70/hr, material markup 40%, overhead allowance 20% of sales. Edit for the job; emergency service is $300/hr. Crew cost must include your applicable burden.</p>${d.rows.map((r,i)=>`<div class="line"><label>Work description<input data-row="${i}" data-key="label" value="${esc(r.label)}"></label><div class="grid"><label>Quantity<input type="number" min=".01" step=".01" data-row="${i}" data-key="qty" value="${esc(r.qty)}"></label><label>Material cost / unit $<input type="number" min="0" step=".01" data-row="${i}" data-key="material" value="${esc(r.material)}"></label><label>Two-person crew hours / unit<input type="number" min="0" step=".25" data-row="${i}" data-key="hours" value="${esc(r.hours)}"></label></div><button class="btn danger" data-remove-row="${i}">Remove line</button></div>`).join('')}<button class="btn" id="add-row">Add separate work item</button><div id="totals">${totals()}</div><div id="guard" class="warn ${c.complete?'good':''}">${c.complete?'Pricing complete. Review before sending.':'Complete descriptions, quantities, materials, hours and rates to continue.'}</div>${nav(true,true,'Preview Proposal')}</div>`}
function totals(){const c=recalc();return `<div class="summary"><div class="pair"><span>Customer price</span><b class="mono">${money(c.sum)}</b></div><div class="pair"><span>Direct costs (internal)</span><b class="mono">${c.complete?money(c.cost):'Incomplete'}</b></div><div class="pair"><span>Gross profit (internal)</span><b class="mono">${c.complete?money(c.profit):'Incomplete'}</b></div><div class="pair"><span>Gross margin</span><b>${c.complete?c.margin.toFixed(1)+'%':'Pending'}</b></div><div class="pair"><span>Overhead allowance</span><b>${c.complete?money(c.overhead):'Pending'}</b></div><div class="pair"><span>After overhead allowance</span><b>${c.complete?money(c.afterOverhead):'Pending'}</b></div></div>`}
function customerProposal(){const c=recalc();return `<section class="proposal"><h1>NCS ELECTRIC, INC.</h1><small class="tag">PROPOSAL DRAFT · SUBJECT TO REVIEW</small><div class="section"><b>${esc(d.name||'Customer name')}</b><br>${esc(d.address||'Sample Site')}<br>${esc(d.contact||'')}</div><div class="section"><h2>${esc(d.work)}</h2><p>${esc(d.description||'Scope to be field verified.').replace(/\n/g,'<br>')}</p><p>${esc(d.extra).replace(/\n/g,'<br>')}</p><b>Selected scope:</b><ul>${d.selected.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Base item only</li>'}</ul></div><div class="section"><h2>Estimate</h2><table>${d.rows.map(r=>`<tr><td>${esc(r.label)} (${esc(r.qty)} ea)</td><td>${money(window.NCSPricing.linePrice(r,d.rates))}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>${money(c.sum)}</td></tr></table></div>${d.photos.length?`<div class="section"><h2>Field photo (local phone preview)</h2><div class="photos">${d.photos.slice(0,4).map(p=>`<div class="photo"><img src="${p.data}" alt="Jobsite"></div>`).join('')}</div></div>`:''}<div class="section"><b>Review required.</b> Scope and price are subject to field verification and written acceptance. Hidden conditions and work outside the stated scope require a written change order. Permit fees, taxes and other charges must be included as separate lines when applicable.<p style="margin-top:20px">Customer signature: _________________________ Date: __________</p></div></section>`}
function proposalStep(){return `<div class="card"><h1>4. Customer proposal draft</h1><p class="muted">Internal costs and margin are excluded from this preview and from printing.</p><div id="proposal">${customerProposal()}</div><div class="footer no-print"><div><button class="btn" id="back">Edit Price</button><button class="btn" id="save">Save Draft</button></div><div><button class="btn primary" id="print">Print / Save PDF</button></div></div></div>`}
function bind(){if($('#take'))$('#take').onclick=()=>$('#camera').click();if($('#pick'))$('#pick').onclick=()=>$('#library').click();for(const input of ['name','contact','address','description','extra'])if($('#'+input))$('#'+input).oninput=e=>d[input]=e.target.value;document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{d.photos.splice(Number(b.dataset.delete),1);show()});if($('#cat'))$('#cat').onchange=e=>{d.cat=e.target.value;d.work=Object.keys(CAT[d.cat])[0];d.selected=[];d.rows=[];show()};if($('#work'))$('#work').onchange=e=>{d.work=e.target.value;d.selected=[];d.rows=[];show()};document.querySelectorAll('[data-item]').forEach(b=>b.onchange=e=>{const label=CAT[d.cat][d.work].items[Number(b.dataset.item)];d.selected=e.target.checked?[...d.selected,label]:d.selected.filter(x=>x!==label)});document.querySelectorAll('[data-row]').forEach(input=>input.oninput=e=>{let r=d.rows[Number(input.dataset.row)];r[input.dataset.key]=e.target.value;$('#totals').innerHTML=totals();const ok=recalc().complete;$('#guard').textContent=ok?'Pricing complete. Review before sending.':'Complete every line before continuing.';$('#guard').classList.toggle('good',ok)});document.querySelectorAll('[data-rate]').forEach(el=>el.oninput=()=>{d.rates[el.dataset.rate]=el.value;$('#totals').innerHTML=totals();$('#guard').textContent=recalc().complete?'Pricing complete. Review before sending.':'Complete all pricing fields.'});if($('#add-row'))$('#add-row').onclick=()=>{d.rows.push({id:'line'+Date.now(),label:'',qty:1,material:'',hours:''});show()};document.querySelectorAll('[data-remove-row]').forEach(el=>el.onclick=()=>{d.rows.splice(Number(el.dataset.removeRow),1);show()});if($('#back'))$('#back').onclick=()=>{stage=Math.max(0,stage-1);show()};if($('#save'))$('#save').onclick=()=>{if(save())toast('Draft saved on this device');else toast(saveError)};if($('#next'))$('#next').onclick=()=>{if(stage===0&&(!d.name.trim()||!d.address.trim())){toast('Enter the customer name and job address');return;}if(stage===2&&(!d.name.trim()||!d.address.trim())){stage=0;show();toast('Enter customer name and job address');return;}if(stage===2&&!recalc().complete){toast('Complete every line and rate before continuing');return;}stage=Math.min(3,stage+1);show()};if($('#print'))$('#print').onclick=()=>{if(!recalc().complete){toast('Complete pricing first');return;}$('#printTarget').innerHTML=customerProposal();$('#printTarget').classList.remove('hidden');$('#screen').classList.add('hidden');window.print()}}
function toast(message){let e=document.createElement('div');e.className='status';e.textContent=message;const parent=$('#screen');parent.prepend(e);setTimeout(()=>e.remove(),4000)}
function filedata(file){return new Promise((resolve,reject)=>{const f=new FileReader();f.onload=()=>resolve(f.result);f.onerror=reject;f.readAsDataURL(file)})}
async function addImages(e){const files=[...e.target.files].filter(x=>x.type.startsWith('image/')||/\.(jpg|jpeg|heic|png|webp)$/i.test(x.name)).slice(0,Math.max(0,4-d.photos.length));let failed=0;for(const f of files){try{const src=await filedata(f);const compressed=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const ratio=Math.min(1,1000/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.65))};img.onerror=reject;img.src=src});d.photos.push({data:compressed})}catch(x){failed++}}e.target.value='';show();if(failed)toast('Photo not loaded; try JPG or camera instead')}
$('#camera').addEventListener('change',addImages);$('#library').addEventListener('change',addImages);
$('#home').onclick=()=>{const list=readSaved();const s=$('#screen');$('#steps').innerHTML='';s.innerHTML=`<div class="card"><h1>Saved estimates</h1><button class="btn primary" id="fresh">＋ New Estimate</button><button class="btn danger" id="clear">Clear Saved Drafts</button><p class="muted">Only browser-local drafts are shown. Clearing website storage will erase them.</p><div class="saved">${list.map(x=>`<button data-open="${esc(x.id)}"><b>${esc(x.name||'Unnamed draft')} — ${esc(x.work)}</b><small>${new Date(x.date).toLocaleDateString()}</small></button>`).join('')||'<p>No saved estimates yet.</p>'}</div></div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{d=readSaved().find(x=>x.id===b.dataset.open);stage=recalc().complete?3:2;show()});$('#fresh').onclick=()=>{d=fresh();stage=0;show()};$('#clear').onclick=()=>{if(confirm('Delete all saved drafts on this device?')){persist([]);$('#home').click()}};window.scrollTo(0,0)};
window.addEventListener('afterprint',()=>{$('#printTarget').classList.add('hidden');$('#screen').classList.remove('hidden')});
show();
</script></body></html>
